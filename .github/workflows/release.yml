name: Release
on:
  push:
    tags: ["v*"]
  # Homebrew resolves only PyPI uploads older than one day (its release cooldown), so the
  # formula is built by hand a day after the release: Actions > Release > Run workflow.
  workflow_dispatch:
    inputs:
      version:
        description: "Version on PyPI, e.g. 1.0.1"
        required: true

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: frontend
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install build && python -m build
      - name: Install the wheel in a clean environment and smoke-test it
        run: |
          python -m venv /tmp/clean && /tmp/clean/bin/pip install dist/*.whl
          STACKLOOM_HOME=/tmp/sl /tmp/clean/bin/stackloom --version
          STACKLOOM_HOME=/tmp/sl /tmp/clean/bin/stackloom init --workspace "$PWD"
          unzip -l dist/*.whl | grep -q "stackloom/web/dist/index.html"
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  pypi:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write # trusted publishing; no API token stored
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1

  homebrew:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate and validate the formula
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          version="${VERSION#v}"
          for i in 1 2 3 4 5 6; do curl -sf "https://pypi.org/pypi/stackloom/$version/json" >/dev/null && break; sleep 20; done
          # Homebrew only accepts formulae that live in a tap, so use a throwaway local one.
          brew tap-new --no-git local/stackloom
          brew trust local/stackloom
          tap="$(brew --repository local/stackloom)"
          python3 scripts/make_formula.py "$version" --license MIT > "$tap/Formula/stackloom.rb"
          brew update-python-resources --exclude-packages numpy local/stackloom/stackloom
          brew install --build-from-source local/stackloom/stackloom
          brew test local/stackloom/stackloom
          brew audit --strict local/stackloom/stackloom || true
          mkdir -p out && cp "$tap/Formula/stackloom.rb" out/
      - uses: actions/upload-artifact@v4
        with: { name: homebrew-formula, path: out/stackloom.rb }
