[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "stackloom"
dynamic = ["version"]
description = "Local control centre for a development workspace: projects, services, ports, Docker, databases and CodeCortex maps."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Nafees Mansoor" }]
keywords = ["developer-tools", "workspace", "dashboard", "docker", "database", "codecortex", "localhost", "devops"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "argon2-cffi>=23.1",
    # One shared engine; maps stay in <project>/.codecortex where coding agents read them.
    "codecortex-engine>=2.0.2,<3",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["PyMySQL>=1.1"]
mongodb = ["pymongo>=4.6"]
redis = ["redis>=5.0"]
secrets = ["keyring>=25"]
all = ["stackloom[postgres,mysql,mongodb,redis,secrets]"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.urls]
Homepage = "https://www.nafees.info"

[project.scripts]
stackloom = "stackloom.cli:main"

[tool.hatch.version]
path = "stackloom/__init__.py"

[tool.hatch.build]
# The dashboard is built ahead of time (cd frontend && pnpm build) and ships in both the
# wheel and the sdist, so installing never needs Node.
artifacts = ["stackloom/web/dist/**"]

[tool.hatch.build.targets.wheel]
packages = ["stackloom"]

[tool.hatch.build.targets.sdist]
include = ["stackloom", "tests", "docs", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
